name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Compiles the app on every push so mistakes show up right away.
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ShotLog.xcodeproj -scheme ShotLog -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/ShotLog.app
      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/ShotLog.app Payload/
          zip -qry ShotLog-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ShotLog-unsigned-ipa
          path: ShotLog-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

  # Signs the app with your Apple Developer account and sends it to TestFlight.
  # Runs on every push to main once the secrets exist, or by hand from the Actions tab.
  testflight:
    needs: build
    runs-on: macos-latest
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.dyl.shotlog' }}
    steps:
      - name: Check Apple secrets
        id: check
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Skipping TestFlight: missing secrets:$missing (see README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.check.outputs.ready == 'true'
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        if: steps.check.outputs.ready == 'true'
        run: brew install xcodegen && xcodegen generate
      - name: Write App Store Connect key
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Archive (signed)
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild -project ShotLog.xcodeproj -scheme ShotLog -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ShotLog.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} archive | tail -n 40
      - name: Upload to TestFlight
        if: steps.check.outputs.ready == 'true'
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/ShotLog.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
